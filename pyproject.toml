[project]
name = "brainscanai"
version = "0.1.0"
description = "Exploration et modélisation d'images cérébrales - Détection de tumeurs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "matplotlib==3.9.2",
    "pillow==12.2.0",
    "scikit-learn==1.5.1",
    "jupyter==1.0.0",
    "ipykernel==6.29.4",
    "opencv-python==4.10.0.84",
    "umap-learn==0.5.6",       # Réduction de dimensionnalité non-linéaire (étape 3)
    "seaborn==0.13.2",         # Visualisations statistiques avancées
    "plotly==5.22.0",          # Graphiques interactifs
    "optuna>=4.9.0",
]

[tool.uv.sources]
# torch 2.2.2 CUDA 12.1 Windows Python 3.11
torch = { url = "https://download.pytorch.org/whl/cu121/torch-2.2.2%2Bcu121-cp311-cp311-win_amd64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu121/torchvision-0.17.2%2Bcu121-cp311-cp311-win_amd64.whl" }
